name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Copy the game into www
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npm run build:web

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set the app version
        run: |
          GRADLE=android/app/build.gradle
          test -f "$GRADLE" || { echo "Expected $GRADLE from Capacitor"; exit 1; }
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      # With a signing key saved in the repo secrets, every build is signed
      # the same way, so new versions install over old ones.
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/queens-lite-$VERSION.apk"

      # Without a signing key the APK still installs, but each build has a
      # different signature, so updating means uninstalling first.
      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/queens-lite-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: queens-lite-${{ env.VERSION }}
          path: queens-lite-${{ env.VERSION }}.apk

      - name: Publish a release with the APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Queens Lite ${{ env.VERSION }}
          body: |
            Download the APK below and open it on your Android phone to install.
            ${{ env.HAS_KEYSTORE == 'true' && 'This build is signed, so it installs over the previous version.' || 'This is a debug build. Uninstall the previous version before installing it.' }}
          files: queens-lite-${{ env.VERSION }}.apk
